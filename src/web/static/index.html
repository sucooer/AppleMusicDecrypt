<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppleMusicDecrypt Web UI</title>
  <link rel="stylesheet" href="/static/lggc.css?v=local-20260519">
  <link rel="stylesheet" href="/static/styles.css?v=lggc-glass-panel-clean-20260519">
</head>
<body>
  <main class="workbench page-shell">
    <section class="hero-shell">
      <div class="hero-backdrop" aria-hidden="true">
        <div class="gradient-orb orb-a"></div>
        <div class="gradient-orb orb-b"></div>
        <div class="gradient-orb orb-c"></div>
        <div class="artwork-cloud">
          <article class="artwork-tile tile-a">
            <span class="tile-kicker">ALAC</span>
            <strong>Lossless</strong>
            <span>24-bit / 192kHz</span>
          </article>
          <article class="artwork-tile tile-b">
            <span class="tile-kicker">Playlist</span>
            <strong>Batch Rip</strong>
            <span>Album / Artist / MV</span>
          </article>
          <article class="artwork-tile tile-c">
            <span class="tile-kicker">Wrapper</span>
            <strong>Live Status</strong>
            <span>Download / Decrypt</span>
          </article>
        </div>
      </div>

      <section class="panel control-column">
        <div class="hero-card panel control-column lggc">
          <div id="wrapper-banner" class="system-banner" hidden></div>

          <div class="form-stack">
            <label class="field field-url">
              <span>Apple Music 链接</span>
              <input id="url" type="url" placeholder="https://music.apple.com/...">
            </label>
            <label class="toggle"><input id="force" type="checkbox"> <span>强制覆盖已有文件</span></label>
            <div class="actions">
              <button id="download-btn" type="button">下载</button>
            </div>
            <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
          </div>
        </div>
      </section>
    </section>

    <section class="panel task-column lggc">
      <div class="status-cards">
        <article class="status-card lggc">
          <span>状态</span>
          <strong id="task-state">当前没有活动任务</strong>
        </article>
        <article class="status-card lggc">
          <span>下载速度</span>
          <strong id="download-speed">0.00 kB/s</strong>
        </article>
        <article class="status-card lggc">
          <span>解密速度</span>
          <strong id="decrypt-speed">0.00 kB/s</strong>
        </article>
        <article class="status-card lggc">
          <span>活跃任务</span>
          <strong id="active-tasks">0</strong>
        </article>
        <article class="status-card lggc">
          <span>详情</span>
          <strong id="task-detail">等待新的下载任务</strong>
        </article>
        <article class="status-card lggc">
          <span>专辑进度</span>
          <strong id="album-progress">-</strong>
        </article>
        <article class="status-card lggc">
          <span>Wrapper</span>
          <strong id="wm-ready">unknown</strong>
        </article>
        <article class="status-card lggc">
          <span>区域</span>
          <strong id="wm-regions">-</strong>
        </article>
      </div>

      <section class="summary-card task-panel">
        <div class="task-summary-grid">
        <article class="status-card detail-card saved-path-card lggc">
          <span>保存路径</span>
          <strong id="saved-path">下载完成后会显示</strong>
        </article>
        <article id="failed-panel" class="status-card detail-card failed-panel lggc">
          <div class="failed-header">
            <span>失败歌曲</span>
            <button id="retry-failed-btn" class="secondary" type="button">重试失败歌曲</button>
          </div>
          <ul id="failed-tracks" class="failed-tracks"></ul>
        </article>
        </div>
      </section>
    </section>

    <section class="panel log-column lggc">
      <section class="log-panel">
        <h2 class="log-title">实时日志</h2>
        <div id="log-output" class="scroll-region"></div>
      </section>
    </section>

    <footer class="site-footer lggc" aria-label="运行信息">
      <span id="footer-emoji" class="footer-emoji" aria-hidden="true">🎵</span>
      <div class="footer-metrics">
        <span>加载 <strong id="page-load-time">计算中</strong></span>
        <span>服务运行 <strong id="server-uptime">0秒</strong></span>
      </div>
    </footer>
  </main>
  <script src="/static/app.js?v=footer-metrics-20260519" defer></script>
</body>
</html>
